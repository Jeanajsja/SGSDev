worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    sendfile      on;
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;
        server_name _;

        location = /gateway/health {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"status":"ok","gateway":"nginx","routes":{"/api/login":"ms-login:5001","/api/salones":"ms-salones:5002","/api/docentes":"ms-docentes:5003","default":"monolito:5000"}}';
        }

        location /api/login {
            set $login_upstream http://login:5001;
            proxy_pass $login_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/salones {
            set $salones_upstream http://salones:5002;
            proxy_pass $salones_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/docentes {
            set $docentes_upstream http://docentes:5003;
            proxy_pass $docentes_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location / {
            set $mono_upstream http://monolito:5000;
            proxy_pass $mono_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
