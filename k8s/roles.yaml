apiVersion: apps/v1
kind: Deployment
metadata:
  name: roles
  namespace: sgsdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: roles
  template:
    metadata:
      labels:
        app: roles
    spec:
      containers:
        - name: roles
          image: sgsdev-roles:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
          envFrom:
            - secretRef:
                name: sgsdev-db
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: roles
  namespace: sgsdev
spec:
  selector:
    app: roles
  ports:
    - port: 5004
      targetPort: 5004
