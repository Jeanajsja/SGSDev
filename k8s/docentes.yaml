apiVersion: apps/v1
kind: Deployment
metadata:
  name: docentes
  namespace: sgsdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docentes
  template:
    metadata:
      labels:
        app: docentes
    spec:
      containers:
        - name: docentes
          image: sgsdev-docentes:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          envFrom:
            - secretRef:
                name: sgsdev-db
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: docentes
  namespace: sgsdev
spec:
  selector:
    app: docentes
  ports:
    - port: 5003
      targetPort: 5003
