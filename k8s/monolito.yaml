apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolito
  namespace: sgsdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monolito
  template:
    metadata:
      labels:
        app: monolito
    spec:
      containers:
        - name: monolito
          image: sgsdev-monolito:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: sgsdev-db
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: monolito
  namespace: sgsdev
spec:
  selector:
    app: monolito
  ports:
    - port: 5000
      targetPort: 5000
