apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas
  namespace: sgsdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservas
  template:
    metadata:
      labels:
        app: reservas
    spec:
      containers:
        - name: reservas
          image: sgsdev-reservas:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5006
          envFrom:
            - secretRef:
                name: sgsdev-db
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reservas
  namespace: sgsdev
spec:
  selector:
    app: reservas
  ports:
    - port: 5006
      targetPort: 5006
