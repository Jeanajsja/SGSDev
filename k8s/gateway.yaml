apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  namespace: sgsdev
data:
  nginx.conf: |
    worker_processes 1;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/json;
        sendfile      on;
        resolver 10.96.0.10 ipv6=off valid=5s;

        server {
            listen 80;
            server_name _;

            location = /gateway/health {
                default_type application/json;
                add_header Access-Control-Allow-Origin *;
                return 200 '{"status":"ok","gateway":"nginx","platform":"kubernetes","routes":{"/api/login":"login","/api/salones":"salones","/api/docentes":"docentes","/api/roles":"roles","/api/usuarios":"usuarios","/api/reservas":"reservas","default":"monolito"}}';
            }

            location /api/login {
                set $upstream http://login.sgsdev.svc.cluster.local:5001;
                proxy_pass $upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
            }

            location /api/salones {
                set $upstream http://salones.sgsdev.svc.cluster.local:5002;
                proxy_pass $upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
            }

            location /api/docentes {
                set $upstream http://docentes.sgsdev.svc.cluster.local:5003;
                proxy_pass $upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
            }

            location /api/roles {
                set $upstream http://roles.sgsdev.svc.cluster.local:5004;
                proxy_pass $upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
            }

            location /api/usuarios {
                set $upstream http://usuarios.sgsdev.svc.cluster.local:5005;
                proxy_pass $upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
            }

            location /api/reservas {
                set $upstream http://reservas.sgsdev.svc.cluster.local:5006;
                proxy_pass $upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
            }

            location / {
                set $upstream http://monolito.sgsdev.svc.cluster.local:5000;
                proxy_pass $upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sgsdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /gateway/health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sgsdev
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
