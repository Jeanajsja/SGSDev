apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  namespace: sgsdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      containers:
        - name: login
          image: sgsdev-login:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: sgsdev-db
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: login
  namespace: sgsdev
spec:
  selector:
    app: login
  ports:
    - port: 5001
      targetPort: 5001
