apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
  namespace: sgsdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      containers:
        - name: usuarios
          image: sgsdev-usuarios:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
          envFrom:
            - secretRef:
                name: sgsdev-db
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios
  namespace: sgsdev
spec:
  selector:
    app: usuarios
  ports:
    - port: 5005
      targetPort: 5005
