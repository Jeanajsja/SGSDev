apiVersion: apps/v1
kind: Deployment
metadata:
  name: salones
  namespace: sgsdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salones
  template:
    metadata:
      labels:
        app: salones
    spec:
      containers:
        - name: salones
          image: sgsdev-salones:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          envFrom:
            - secretRef:
                name: sgsdev-db
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: salones
  namespace: sgsdev
spec:
  selector:
    app: salones
  ports:
    - port: 5002
      targetPort: 5002
