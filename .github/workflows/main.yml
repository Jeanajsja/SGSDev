jobs: validate: name: Validate SGSDev runs-on: ubuntu-latest timeout-minutes: 15

steps: - name: Checkout repository uses: actions/checkout@v4

- name: Configure Python uses: actions/setup-python@v5 with: python-version: "3.12"

- name: Install backend dependencies run: | python -m pip install --upgrade pip pip install -r requirements.txt

- name: Check Python syntax run: python -m compileall -q backend gateway services main.py wsgi.py

- name: Validate frontend run: | if [ -f frontend/package.json ]; then cd frontend if [ -f package-lock.json ]; then npm ci else npm install fi npm run build --if-present else echo "No frontend/package.json found; skipping frontend build." fi

- name: Validate Docker Compose run: docker compose config --quiet

- name: Check Supabase connection if: ${{ vars.CHECKSUPABASE == 'true' }} env: DATABASEURL: 
