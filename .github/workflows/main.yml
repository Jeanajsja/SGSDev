name: SGSDev CI

on: [push, pullrequest, workflowdispatch]

jobs: validate: runs-on: ubuntu-latest

steps: - name: Descargar repositorio uses: actions/checkout@v4

- name: Configurar Python uses: actions/setup-python@v5 with: python-version: "3.12"

- name: Instalar dependencias run: | python -m pip install --upgrade pip pip install -r requirements.txt

- name: Verificar sintaxis Python run: python -m compileall -q .

- name: Validar Docker Compose run: docker compose config --quiet
