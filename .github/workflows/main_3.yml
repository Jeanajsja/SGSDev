name: SGSDev CI

'on': push: branches: - main pullrequest: branches: - main workflowdispatch:
permissions: contents: read
concurrency: group: sgsdev-
github.workflow−{{ github.ref }} cancel-in-progress: true
jobs: validate: name: Validate Python application runs-on: ubuntu-24.04 timeout-minutes: 20
steps: - name: Checkout repository uses: actions/checkout@v5
- name: Setup Python uses: actions/setup-python@v6 with: python-version-file: .python-version cache: pip cache-dependency-path: requirements.txt
- name: Install dependencies run: | python -m pip install --upgrade pip python -m pip install -r requirements.txt
- name: Check Python syntax run: python -m compileall -q .
- name: Test FastAPI application import run: | python -c "from wsgi import app; print('Application loaded:', app.title)"
- name: Validate Docker Compose run: docker compose config --quiet
- name: Build all Docker services run: docker compose build
- name: CI successful run: echo "SGSDev checks completed successfully."
