<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS - Acceso al Sistema</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ucc: {
                            navy: '#071833',
                            azul: '#0e4a8a',
                            medio: '#1a66b8',
                            dorado: '#edb309',
                            oro: '#e8c547',
                            plata: '#f4f7fb',
                            texto: '#12213a',
                            muted: '#5c6b80'
                        }
                    }
                }
            }
        }
    </script>
    <style>.hidden { display: none !important; }</style>
</head>
<body class="h-screen flex items-center justify-center font-sans" style="background: linear-gradient(160deg, #071833 0%, #0c274f 55%, #0e4a8a 100%);">
    <div class="absolute top-0 left-0 right-0 h-1.5 bg-ucc-dorado"></div>
    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-[400px] border-t-4 border-ucc-dorado">
        <div class="text-center mb-8">
            <div class="bg-ucc-azul w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white font-bold shadow-lg ring-2 ring-ucc-dorado">SGS</div>
            <h1 id="title" class="text-3xl font-black text-ucc-texto tracking-tighter">Bienvenido</h1>
            <p id="subtitle" class="text-ucc-muted text-sm">Universidad Católica de Colombia</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <input type="email" id="l-email" autocomplete="username" placeholder="Correo electrónico" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-ucc-dorado transition">
            <input type="password" id="l-pass" autocomplete="current-password" placeholder="Contraseña" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-ucc-dorado transition">
            <button type="submit" class="w-full bg-ucc-azul text-white font-bold py-4 rounded-2xl hover:bg-ucc-navy shadow-xl transition transform active:scale-95">Entrar al Sistema</button>
            <p class="text-center text-xs text-ucc-muted">
                <a href="javascript:mostrarVista('reset')" class="text-ucc-azul font-bold underline">Olvidé mi contraseña</a>
            </p>
            <p class="text-center text-xs text-ucc-muted">¿No tienes cuenta? <a href="javascript:mostrarVista('register')" class="text-ucc-azul font-bold underline">Regístrate ahora</a></p>
        </form>

        <form id="registerForm" class="hidden space-y-4">
            <input type="text" id="r-nombre" maxlength="100" placeholder="Nombre completo" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl">
            <input type="email" id="r-email" maxlength="255" autocomplete="username" placeholder="Correo electrónico" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl">
            <input type="password" id="r-pass" minlength="12" maxlength="128" autocomplete="new-password" placeholder="Contraseña (mínimo 12 caracteres)" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl">
            <p class="text-center text-xs text-ucc-muted">El registro público crea cuentas de docente.</p>
            <button type="submit" class="w-full bg-ucc-dorado text-ucc-navy font-bold py-4 rounded-2xl hover:bg-ucc-oro shadow-xl transition transform active:scale-95">Crear Cuenta Nueva</button>
            <p class="text-center text-xs text-ucc-muted">¿Ya tienes cuenta? <a href="javascript:mostrarVista('login')" class="text-ucc-azul font-bold underline">Inicia sesión</a></p>
        </form>

        <form id="resetForm" class="hidden space-y-4">
            <input type="email" id="rp-email" maxlength="255" autocomplete="username" placeholder="Correo de tu cuenta" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-ucc-dorado transition">
            <p id="reset-help" class="text-center text-xs text-ucc-muted">Ingresa el correo de tu cuenta para continuar con el restablecimiento.</p>
            <button type="submit" class="w-full bg-ucc-azul text-white font-bold py-4 rounded-2xl hover:bg-ucc-navy shadow-xl transition transform active:scale-95">Enviar enlace</button>
            <div id="reset-link-box" class="hidden text-center text-xs bg-ucc-plata border border-slate-100 rounded-2xl p-3 space-y-2"></div>
            <p class="text-center text-xs text-ucc-muted"><a href="javascript:mostrarVista('login')" class="text-ucc-azul font-bold underline">Volver al inicio de sesión</a></p>
        </form>
    </div>

    <script>
        const API = window.location.origin + "/api";

        function mostrarVista(vista) {
            const login = document.getElementById('loginForm');
            const register = document.getElementById('registerForm');
            const reset = document.getElementById('resetForm');
            login.classList.add('hidden');
            register.classList.add('hidden');
            reset.classList.add('hidden');
            if (vista === 'register') {
                register.classList.remove('hidden');
                document.getElementById('title').innerText = "Nueva Cuenta";
                document.getElementById('subtitle').innerText = "Crea tu perfil de docente";
            } else if (vista === 'reset') {
                reset.classList.remove('hidden');
                document.getElementById('title').innerText = "Recuperar acceso";
                document.getElementById('subtitle').innerText = "Restablece tu contraseña";
                const help = document.getElementById('reset-help');
                if (help) {
                    help.textContent = "Ingresa el correo de tu cuenta para continuar con el restablecimiento.";
                }
                const box = document.getElementById('reset-link-box');
                if (box) {
                    box.classList.add('hidden');
                    box.innerHTML = '';
                }
            } else {
                login.classList.remove('hidden');
                document.getElementById('title').innerText = "Bienvenido";
                document.getElementById('subtitle').innerText = "Universidad Católica de Colombia";
            }
        }

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('l-email').value,
                        password: document.getElementById('l-pass').value
                    })
                });
                const result = await res.json();
                if (res.ok && result.access_token && result.user) {
                    sessionStorage.setItem('access_token', result.access_token);
                    sessionStorage.setItem('user', JSON.stringify(result.user));
                    window.location.href = 'index.html';
                } else {
                    alert("Error: " + (result.message || result.detail || "no se pudo iniciar sesion"));
                }
            } catch (err) {
                alert("Fallo de red: El servidor Python está apagado.");
            }
        };

        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('r-nombre').value,
                email: document.getElementById('r-email').value,
                password: document.getElementById('r-pass').value,
                id_rol: 3
            };
            try {
                const res = await fetch(`${API}/usuarios`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                const contentType = res.headers.get('content-type') || '';
                if (!contentType.includes('application/json')) {
                    alert("El servidor se está iniciando o no está disponible. Intenta de nuevo en unos segundos.");
                    return;
                }

                const result = await res.json();
                if (res.ok) {
                    alert(result.message || "Cuenta creada exitosamente.");
                    mostrarVista('login');
                } else {
                    alert("Error: " + (result.message || result.detail || "No se pudo crear la cuenta."));
                }
            } catch (err) {
                alert("Error al conectar con el servidor.");
            }
        };

        document.getElementById('resetForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('rp-email').value.trim();
            const box = document.getElementById('reset-link-box');
            box.classList.add('hidden');
            box.innerHTML = '';
            try {
                const res = await fetch(`${API}/usuarios/olvide-password`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email })
                });
                const contentType = res.headers.get('content-type') || '';
                if (!contentType.includes('application/json')) {
                    alert("El servidor se está iniciando o no está disponible. Intenta de nuevo en unos segundos.");
                    return;
                }
                const result = await res.json();
                if (res.ok && result.status === 'ok') {
                    const help = document.getElementById('reset-help');
                    if (result.reset_link) {
                        if (help) {
                            help.textContent = "Abre el enlace para definir tu nueva contraseña.";
                        }
                        box.classList.remove('hidden');
                        box.innerHTML = `
                            <p class="font-bold text-ucc-texto">Enlace listo</p>
                            <a class="inline-block mt-1 text-ucc-azul font-bold underline break-all" href="${result.reset_link}">Abrir enlace de restablecimiento</a>
                        `;
                        document.getElementById('subtitle').innerText = "Continúa con el enlace";
                    } else if (help) {
                        help.textContent = result.message || "Si el correo está registrado, revisa tu bandeja de entrada.";
                    }
                    alert(result.message || "Revisa tu correo.");
                } else {
                    const detalle = result.message || (typeof result.detail === 'string' ? result.detail : null) || "No se pudo enviar el enlace.";
                    alert(detalle);
                }
            } catch (err) {
                alert("Error al conectar con el servidor.");
            }
        };
</script>
</body>
</html>
