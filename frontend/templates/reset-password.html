<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS - Restablecer contraseña</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ucc: {
                            navy: '#071833',
                            azul: '#0e4a8a',
                            dorado: '#edb309',
                            oro: '#e8c547',
                            plata: '#f4f7fb',
                            texto: '#12213a',
                            muted: '#5c6b80'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen flex items-center justify-center font-sans" style="background: linear-gradient(160deg, #071833 0%, #0c274f 55%, #0e4a8a 100%);">
    <div class="absolute top-0 left-0 right-0 h-1.5 bg-ucc-dorado"></div>
    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-[400px] border-t-4 border-ucc-dorado">
        <div class="text-center mb-8">
            <div class="bg-ucc-azul w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white font-bold shadow-lg ring-2 ring-ucc-dorado">SGS</div>
            <h1 class="text-3xl font-black text-ucc-texto tracking-tighter">Nueva contraseña</h1>
            <p class="text-ucc-muted text-sm">Define tu nueva clave de acceso</p>
        </div>

        <form id="newPassForm" class="space-y-4">
            <input type="password" id="np-pass" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Nueva contraseña" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-ucc-dorado transition">
            <input type="password" id="np-pass2" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Confirmar nueva contraseña" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-ucc-dorado transition">
            <p class="text-center text-xs text-ucc-muted">Debe incluir letras y números (mínimo 8 caracteres).</p>
            <button type="submit" class="w-full bg-ucc-azul text-white font-bold py-4 rounded-2xl hover:bg-ucc-navy shadow-xl transition transform active:scale-95">Guardar contraseña</button>
            <p class="text-center text-xs text-ucc-muted"><a href="login.html" class="text-ucc-azul font-bold underline">Volver al inicio de sesión</a></p>
        </form>
    </div>

    <script>
        const API = window.location.origin + "/api";
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';

        if (!token) {
            alert("El enlace de restablecimiento no es válido.");
            window.location.href = "login.html";
        }

        document.getElementById('newPassForm').onsubmit = async (e) => {
            e.preventDefault();
            const nueva_password = document.getElementById('np-pass').value;
            const confirmar_password = document.getElementById('np-pass2').value;
            if (nueva_password !== confirmar_password) {
                alert("La confirmación de contraseña no coincide");
                return;
            }
            try {
                const res = await fetch(`${API}/usuarios/restablecer-password`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token, nueva_password, confirmar_password })
                });
                const contentType = res.headers.get('content-type') || '';
                if (!contentType.includes('application/json')) {
                    alert("El servidor no está disponible. Intenta de nuevo.");
                    return;
                }
                const result = await res.json();
                if (res.ok && result.status === 'ok') {
                    alert(result.message || "Contraseña actualizada.");
                    window.location.href = "login.html";
                } else {
                    alert("Error: " + (result.message || result.detail || "No se pudo restablecer la contraseña."));
                }
            } catch (err) {
                alert("Error al conectar con el servidor.");
            }
        };
    </script>
</body>
</html>
